<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nino Media | Client Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{margin:0;font-family:Arial;background:#0c1022;color:white}

/* SIDEBAR */
.sidebar{
position:fixed;left:0;top:0;height:100%;
width:230px;background:#020617;padding:20px
}
.sidebar h2{text-align:center}
.sidebar a{
display:block;color:white;padding:12px;margin:5px 0;
text-decoration:none;border-radius:5px
}
.sidebar a:hover{background:#0a5cff}

/* MAIN */
.main{
margin-left:250px;padding:30px
}
.card{
background:white;color:black;
padding:20px;border-radius:10px;margin-bottom:20px
}
.btn{
background:#0a5cff;color:white;
padding:10px;border:none;border-radius:5px;cursor:pointer
}
.btn:hover{background:#063cb5}

/* TABLE */
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #ccc;text-align:left}

/* CHAT */
textarea{width:100%;height:80px}

</style>
</head>

<body>

<div class="sidebar">
<h2>Nino Media</h2>
<a onclick="show('orders')"><i class="fa fa-cart"></i> My Orders</a>
<a onclick="show('profile')"><i class="fa fa-user"></i> My Profile</a>
<a onclick="show('track')"><i class="fa fa-location-dot"></i> Track Order</a>
<a onclick="show('messages')"><i class="fa fa-envelope"></i> Messages</a>
<a onclick="logout()"><i class="fa fa-power-off"></i> Logout</a>
</div>

<div class="main">

<h1>Welcome Client 👋</h1>

<!-- ORDERS -->
<div id="orders" class="card">
<h3>My Orders</h3>
<table>
<thead>
<tr><th>Service</th><th>Price</th></tr>
</thead>
<tbody id="orderTable"></tbody>
</table>
</div>

<!-- PROFILE -->
<div id="profile" class="card" style="display:none">
<h3>My Profile</h3>
<p><b>Username:</b> <span id="pUser"></span></p>
<p><b>Email:</b> <span id="pEmail"></span></p>
</div>

<!-- TRACK -->
<div id="track" class="card" style="display:none">
<h3>Order Tracking</h3>
<p>Status: <b>Processing</b></p>
<p>Expected Delivery: 3 Working Days</p>
</div>

<!-- MESSAGES -->
<div id="messages" class="card" style="display:none">
<h3>Messages from Nino Media</h3>
<div id="msgBox"></div>
<textarea id="reply" placeholder="Reply..."></textarea><br><br>
<button class="btn" onclick="send()">Send</button>
</div>

</div>

<script>

/* SECURITY */
if(localStorage.getItem("logged")!="yes"){
location.href="index.html";
}

/* LOAD ORDERS */
let orders=JSON.parse(localStorage.getItem("orders")||"[]");
orders.forEach(o=>{
orderTable.innerHTML+=`
<tr>
<td>${o.name}</td>
<td>R${o.price}</td>
</tr>`;
});

/* PROFILE */
let users=JSON.parse(localStorage.getItem("users")||"[]");
let u=users[users.length-1];
if(u){
pUser.innerText=u.username;
pEmail.innerText=u.email;
}

/* NAV */
function show(id){
["orders","profile","track","messages"].forEach(s=>{
document.getElementById(s).style.display="none";
});
document.getElementById(id).style.display="block";
}

/* MESSAGES */
let msgs=[
"Nino Media: Your order has been received",
"Nino Media: Our team started working"
];
msgs.forEach(m=>{
msgBox.innerHTML+=`<p>${m}</p>`;
});

function send(){
msgBox.innerHTML+=`<p><b>You:</b> ${reply.value}</p>`;
reply.value="";
}

/* LOGOUT */
function logout(){
localStorage.clear();
location.href="index.html";
}

</script>

</body>
</html>
